name: Android device video verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-emulator:
    name: device-video-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
            arch: x86_64
            abi: x86_64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Enable KVM (Linux)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Free runner disk for Android userdata (Linux)
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake" "$ANDROID_HOME/platforms" "$ANDROID_HOME/build-tools"
          df -h .
      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Fetch private CI game input (never committed to Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-rom
          gh release download ci-private-inputs --repo "$GITHUB_REPOSITORY" --pattern umk3-usa.md --dir ci-rom
      - name: Boot API 35 emulator and verify actual screen pixels
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_6
          cores: 4
          ram-size: 4096M
          heap-size: 512M
          disk-size: 2048M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash tests/ci/device-video.sh ${{ matrix.abi }}
      - name: Upload device screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-video-proof-${{ matrix.name }}
          path: |
            artifacts/device-captures/
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30

  arm64-core-pixels:
    name: arm64-native-core-pixels
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch private CI game input (never committed to Git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-rom
          gh release download ci-private-inputs --repo "$GITHUB_REPOSITORY" --pattern umk3-usa.md --dir ci-rom
      - name: Build native ARM64 core and decode real RGB565 frames
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake python3-pil
          cmake -S core/src/main/cpp -B host-build -DCMAKE_BUILD_TYPE=Release -DSEGA_TEST_API=OFF
          cmake --build host-build -j2
          python3 tests/verify_video_pixels.py host-build/libgenesis_host.so ci-rom/umk3-usa.md arm64-core-proof 900
      - name: Upload ARM64 core pixel evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arm64-core-pixel-proof
          path: arm64-core-proof/
          if-no-files-found: warn
          retention-days: 30
