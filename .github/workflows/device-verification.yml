name: Android device video verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: device-video-${{ github.ref }}
  cancel-in-progress: true

jobs:
  device-emulator:
    name: device-video-${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            runner: ubuntu-latest
            arch: x86_64
            abi: x86_64
          - name: arm64
            runner: macos-15
            arch: arm64-v8a
            abi: arm64-v8a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
      - name: Enable KVM (Linux)
        if: runner.os == 'Linux'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install pinned Android build tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Boot API 35 emulator and verify actual screen pixels
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 35
          target: google_apis
          arch: ${{ matrix.arch }}
          profile: pixel_6
          cores: 2
          ram-size: 3072M
          heap-size: 512M
          disk-size: 4096M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            ./gradlew :android:connectedDebugAndroidTest --no-daemon --max-workers=2 --stacktrace \
              -Pandroid.injected.build.abi=${{ matrix.abi }} \
              -Pandroid.testInstrumentationRunnerArguments.class=com.midoali.atari.VideoInstrumentedTest \
              -Pandroid.testInstrumentationRunnerArguments.screenshots=true
            mkdir -p artifacts/device-captures
            adb logcat -d > artifacts/device-captures/logcat.txt || true
            PKG=com.midoali.atari.debug
            for f in $(adb shell run-as "$PKG" ls files/test-captures 2>/dev/null | tr -d '\r'); do
              adb exec-out run-as "$PKG" cat "files/test-captures/$f" > "artifacts/device-captures/$f" || true
            done
      - name: Upload device screenshots and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: device-video-proof-${{ matrix.name }}
          path: |
            artifacts/device-captures/
            android/build/reports/androidTests/
            android/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 30
